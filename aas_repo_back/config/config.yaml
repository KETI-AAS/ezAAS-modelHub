# Sanitized template: contains placeholders only, not production credentials.
# Replace CHANGE_ME_* and example.com values in private deployment configuration.
# CHANGE_ME_* Fernet placeholders are not valid keys; supply real keys before use.
# Commit config.example.yaml only; other config YAML files are gitignored.

debug:
  mode: 1
service_info:
  name: AAS_Repository
  lang_code: 1
  host_f_domain: https://hub.example.com
  host_f_ip: http://127.0.0.1:5000
  host_b_domain: https://hub.example.com/api
  host_portal: https://portal.example.com
social_google:
  GOOGLE_CLIENT_ID: CHANGE_ME_GOOGLE_CLIENT_ID
  GOOGLE_CLIENT_SECRET: CHANGE_ME_GOOGLE_CLIENT_SECRET
  GOOGLE_AUTH_URL: https://accounts.google.com/o/oauth2/v2/auth
  GOOGLE_TOKEN_URL: https://oauth2.googleapis.com/token
  GOOGLE_PROFILE_URL: https://www.googleapis.com/oauth2/v2/userinfo
  GOOGLE_REDIRECT_URI: '{url}/google/callback'
social_naver:
  NAVER_CLIENT_ID: CHANGE_ME_NAVER_CLIENT_ID
  NAVER_CLIENT_SECRET: CHANGE_ME_NAVER_CLIENT_SECRET
  NAVER_AUTH_URL: https://nid.naver.com/oauth2.0/authorize
  NAVER_TOKEN_URL: https://nid.naver.com/oauth2.0/token
  NAVER_PROFILE_URL: https://openapi.naver.com/v1/nid/me
  NAVER_REDIRECT_URI: '{url}/naver/callback'
file:
  fullpath: /app/data/aas
  mainpath: /aas_files/aas
  sm_fullpath: /app/data/sm
  sm_mainpath: /aas_files/sm
  url: null
fastapi:
  max_request: 1000000
  max_request_interval_rt: 0.1
keti_api:
  url: https://api.example.com
postgres:
  host: localhost
  port: 5432
  username: CHANGE_ME_DB_USER
  password: CHANGE_ME_DB_PASSWORD
  database: CHANGE_ME_DB_NAME
  timeout: 7
auth:
  JWT_SECRET_KEY: CHANGE_ME_JWT_SECRET_KEY
  ALGORITHM: HS256
  password_secret_key: CHANGE_ME_FERNET_KEY
  target: AASREPO_IMPIX
  expires_sec: 43200
  expires_hour: 1
mail:
  smtp_title: KETI AAS Repository Hub
  smtp_server: smtp.example.com
  smtp_port: 587
  email_address: sender@example.com
  email_password: CHANGE_ME_SMTP_PASSWORD
  reset_password_url: '{url}/reset-password?token='
csv:
  passKey: CHANGE_ME_CSV_FERNET_KEY
log:
  level: 4
  name: AASREPO
  db_name: aas
  path: /app/logs
  length:
    system: 20000
